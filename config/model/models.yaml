# VRAM Budget Strategy
vram_strategy:
  total_vram_gb: 96
  kernel_eval_reserved_gb: 20  # Reserved for Triton compilation + execution
  max_model_vram_gb: 76        # 96 - 20
  selection_rules:
    - "If model FP16 VRAM <= max_model_vram_gb: use original (no quantization)"
    - "If model FP16 VRAM > max_model_vram_gb: use AWQ/GPTQ quantization"
    - "If quantized VRAM still > max_model_vram_gb: skip model"
