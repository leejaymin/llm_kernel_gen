# Default configuration for llm-kernel
# GPU Target
gpu:
  name: "RTX PRO 6000 Blackwell"
  arch: "sm_120"
  vram_gb: 96
  memory_bandwidth_gbs: 1792
  fp16_tflops: 251.9
  cuda_cores: 24064
  tensor_cores: 752

# LLM Server
llm:
  base_url: "http://localhost:8000/v1"
  api_key: "EMPTY"
  timeout: 180
  default_model: "qwen2.5-coder-32b"

# OpenAI API (optional)
openai:
  api_key_env: "OPENAI_API_KEY"  # Environment variable name
  default_model: "gpt-4o"
  timeout: 120

# Generation parameters
generation:
  temperature: 0.3
  max_tokens: 8192
  top_p: 0.95
  num_samples: 1

# Pipeline
pipeline:
  strategy: "iterative"        # single_pass | iterative | best_of_n
  max_iterations: 5
  speedup_threshold: 1.0
  correctness_tolerance: 1.0e-02
  timeout_seconds: 300

# Profiling: feed measured kernel bottlenecks back into the optimize loop.
profiling:
  enabled: true
  backend: "auto"              # auto | ncu | roofline | off
                               #   auto: try ncu, fall back to roofline
                               #   ncu : Nsight Compute hardware counters
                               #         (needs GPU-counter permission:
                               #          NVreg_RestrictProfilingToAdminUsers=0
                               #          or run as root; else ERR_NVGPUCTRPERM)
                               #   roofline: analytical, no admin required
  ncu_path: "/home/jemin/miniforge3/nsight-compute-2025.3.1/ncu"
  ncu_timeout_s: 180
  warmup: 5
  timed: 50

# Skill memory: AdaExplore-style cross-problem failure-driven adaptation.
# Distills compile/runtime/value-mismatch failures into persistent
# "You cannot ..." rules and injects the top ones into the generation prompt.
skill_memory:
  enabled: false                 # turn on to accumulate + inject learned rules
  path: "skill_memory_store.txt"
  max_inject: 15

# KernelBench
kernelbench:
  dataset_src: "huggingface"
  backend: "triton"
  eval_mode: "local"
  n_correctness: 5
  n_trial: 10

# TritonBench
tritonbench:
  repo_path: "external/TritonBench"
  enabled: true
  default_channel: "T"  # T (Triton) or G (General)

# Execution
execution:
  max_workers: 4
  run_dir: "runs"
