[project]
name = "llm-kernel"
version = "0.1.0"
description = "Local LLM-based Triton kernel code generation with KernelBench evaluation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "openai>=1.0",
    "typer[all]>=0.9",
    "rich>=13.0",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "datasets>=2.0",
    "huggingface_hub>=0.20",
    "httpx>=0.25",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6"]
sglang = ["sglang[all]>=0.4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
llm-kernel = "llm_kernel.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
